    <script>

    auth: {
        persistSession: true,
        storageKey: 'ebank-auth-session', // یک نام ثابت و اختصاصی ✅

        detectSessionInUrl: false

});

// بخش اول: ورود و امنیت (خوانا)
async function hashPassword(p) {
    const b = new TextEncoder().encode(p);
    const h = await crypto.subtle.digest('SHA-256', b);
    return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0')).join('');
}

async function openMasterLoginGate() {
    const { value: p } = await Swal.fire({ title: 'COMMAND CENTER', input: 'password', confirmButtonColor: '#fbbf24', allowOutsideClick: false, customClass: { popup: 'rounded-[2.5rem] glass-card' } });
    if (p) {
        const { data: v } = await supabaseClient.rpc('verify_master_access', { input_password: p });
        if (v === true) {
            const { value: o } = await Swal.fire({ title: 'SECURITY CHALLENGE', text: 'فرمول ساعت را وارد کنید:', input: 'text', confirmButtonColor: '#10b981', allowOutsideClick: false, customClass: { popup: 'rounded-[2.5rem] glass-card' } });
            const { data: v2 } = await supabaseClient.rpc('verify_2fa_access', { user_provided_code: o });
            if (v2 === true) {
                sessionStorage.setItem('is_super_admin', 'true');
                window.location.href = 'super_admin.html';
            } else { Swal.fire({ text: 'کد غلط است', icon: 'error' }); }
        } else { Swal.fire({ text: 'رمز غلط است', icon: 'error' }); }
    }
}

// بخش دوم: موتور درگاه مخفی (نامحسوس)
let _α = 0, _β = 0, _γ = false, _τ1 = null, _τ2 = null, _Ω = 5;

// لودینگ مستقل اسپلش
window.addEventListener('load', () => {
    setTimeout(() => {
        const s = document.getElementById('splash-screen');
        if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 700); }
    }, 2000);
});

document.addEventListener('DOMContentLoaded', async () => {
    // پیش‌بارگذاری عدد ثابت از دیتابیس
    try {
        const { data } = await supabaseClient.from('global_config').select('click_constant').eq('id', 1).maybeSingle();
        if (data) _Ω = data.click_constant;
    } catch(e) { _Ω = 5; }

    const lp = localStorage.getItem('saved_pool_code');
    if (lp && document.getElementById('login-pool-code')) document.getElementById('login-pool-code').value = lp;

    const e = document.getElementById('secret-eddie');
    const d = document.getElementById('secret-dot');

    if (e && d) {
        // فاز ۱: ضربه روی کلمه EDDIE
        e.onclick = () => {
            const val = document.getElementById('login-pool-code')?.value.trim();
            const mt = Math.floor(new Date().getMinutes() / 10);
            const key = (_Ω + mt).toString();

            if (val !== key) { _α = 0; return; }
            
            _α++;
            clearTimeout(_τ1);
            if (_α > _Ω) { _α = 0; _γ = false; if (navigator.vibrate) navigator.vibrate(150); return; }

            _τ1 = setTimeout(() => {
                if (_α === _Ω) {
                    _γ = true;
                    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
                }
            }, 350);
        };

        // فاز ۲: ضربه روی نقطه لوگو
        d.onclick = () => {
            if (!_γ) return;
            _β++;
            clearTimeout(_τ2);
            const mt = Math.floor(new Date().getMinutes() / 10);
            const target = _Ω + mt;

            if (_β > target) { _α = 0; _β = 0; _γ = false; if (navigator.vibrate) navigator.vibrate(150); return; }

            _τ2 = setTimeout(() => {
                if (_β === target) {
                    _α = 0; _β = 0; _γ = false;
                    const c = document.getElementById('login-pool-code');
                    if (c) c.value = '';
                    if (navigator.vibrate) navigator.vibrate(200);
                    openMasterLoginGate();
                }
            }, 350);
        };
    }
});

// بخش سوم: ورود اعضا
async function handleLogin() {
    // ۱. دسترسی به المان‌ها
    const pI = document.getElementById('login-pool-code');
    const mI = document.getElementById('login-mobile');
    const psI = document.getElementById('login-password');
    const btn = document.getElementById('login-btn');

    if(!pI || !mI || !psI) return;

    const p = pI.value.trim().toUpperCase();
    const m = mI.value.trim().replace(/\s+/g, ''); // حذف فاصله‌های احتمالی
    const ps = psI.value;

    // ۲. بررسی خالی نبودن فیلدها
    if(!p || !m || !ps) {
        return Swal.fire({ text: "لطفاً تمام فیلدها را پر کنید ❌", icon: 'warning', confirmButtonColor: '#10b981' });
    }

    // ۳. فعال‌سازی لودینگ
    btn.disabled = true; 
    btn.innerHTML = '<span class="loader"></span> در حال تایید...';

    try {
        // ۴. استعلام وجود صندوق
        const { data: pD, error: pErr } = await supabaseClient.from('pools').select('id').eq('pool_code', p).maybeSingle();
        if(pErr || !pD) throw new Error("کد بانک (Pool ID) یافت نشد! ❌");

        // ۵. ورود رسمی به سیستم هویت سوپابیس (JWT)
        const { data: u, error: authError } = await supabaseClient.auth.signInWithPassword({
            email: `${m}@ebank.com`,
            password: ps
        });

        if (authError) throw new Error("شماره موبایل یا رمز عبور اشتباه است ❌");

        // ۶. دریافت پروفایل کامل عضو از جدول دیتابیس
        const { data: prof, error: dbError } = await supabaseClient
            .from('members')
            .select('*')
            .eq('id', u.user.id)
            .single();

        if (dbError || !prof) throw new Error("پروفایل کاربری یافت نشد! ❌");

        // ۷. ثبت دقیق اطلاعات در حافظه موقت (Session Storage) 👇
        sessionStorage.clear(); // پاکسازی نشست‌های قبلی
        sessionStorage.setItem('user_id', prof.id);
        sessionStorage.setItem('pool_id', prof.pool_id);
        sessionStorage.setItem('user_name', prof.full_name); // برای نمایش نام در هدر ✅
        sessionStorage.setItem('is_admin', String(prof.is_admin));
        sessionStorage.setItem('is_super_admin', String(prof.is_super_admin));
        
        // ذخیره کد بانک برای ورودهای بعدی
        localStorage.setItem('saved_pool_code', p);

        // ۸. نمایش پیام موفقیت شیک
        Swal.fire({
            title: 'ورود موفقیت‌آمیز ✅',
            text: `خوش آمدید ${prof.full_name}`,
            icon: 'success',
            showConfirmButton: false,
            timer: 1200,
            customClass: { popup: 'rounded-[2.5rem]' }
        });

        // ۹. انتقال هوشمند با وقفه ایمنی (رفع مشکل پرش به لاگین) 👇
        setTimeout(() => {
            if (prof.is_admin === true) {
                window.location.replace('admin.html');
            } else {
                window.location.replace('member.html');
            }
        }, 150); // این ۱۵۰ میلی‌ثانیه حیاتی است!

    } catch (e) {
        // مدیریت خطاها
        console.error("Login Error:", e.message);
        Swal.fire({ 
            title: 'توقف ورود', 
            text: e.message, 
            icon: 'error', 
            confirmButtonColor: '#ef4444',
            customClass: { popup: 'rounded-[2.5rem]' }
        });
        btn.disabled = false; 
        btn.innerText = 'تایید هویت و ورود';
    }
}

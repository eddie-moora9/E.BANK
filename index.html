<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>E.BANK | ورود ایمن</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background: #fdfdfd; background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px); background-size: 26px 26px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; overflow-x: hidden; }
        .login-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(15px); border: 1px solid #f1f5f9; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05); }
        input { text-align: right !important; direction: rtl !important; }
        .ltr-input { direction: ltr !important; text-align: right !important; }
        .btn-tap:active { transform: scale(0.96); }
        .loader { width: 18px; height: 18px; border: 2px solid #FFF; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .glass-card { background: #1e293b !important; color: white !important; }

        /* ========== اسپلش اسکرین (طلایی) ========== */
        :root {
            --splash-bg: #020617;
            --gold: #fbbf24;
            --gold-bright: #fde68a;
            --gold-deep: #d97706;
            --gold-glow: rgba(251, 191, 36, 0.5);
            --splash-slate: #94a3b8;
            --splash-white: #f8fafc;
        }
        #splash {
            position: fixed; inset: 0; z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--splash-bg); color: var(--splash-white);
            -webkit-font-smoothing: antialiased;
            transition: opacity 0.85s cubic-bezier(0.4,0,0.2,1), transform 0.85s cubic-bezier(0.4,0,0.2,1), filter 0.85s ease;
        }
        #splash.fade-out { opacity: 0; transform: scale(1.08); filter: blur(12px); pointer-events: none; }
        .grid-bg {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(251,191,36,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(251,191,36,.03) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 20%, transparent 75%);
            opacity: 0; animation: gridFade 1.6s ease .2s forwards; pointer-events: none;
        }
        @keyframes gridFade { to { opacity: 1; } }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; will-change: transform, opacity; }
        .orb-1 { width:420px;height:420px; background: radial-gradient(circle, rgba(251,191,36,.4) 0%, transparent 70%); top:50%; left:50%; transform: translate(-50%,-55%); opacity:0; animation: orbPulse 4s ease-in-out .4s infinite, orbIn 1.4s ease-out .3s forwards; }
        .orb-2 { width:280px;height:280px; background: radial-gradient(circle, rgba(217,119,6,.25) 0%, transparent 70%); top:42%; left:38%; opacity:0; animation: orbDrift 7s ease-in-out .8s infinite, orbIn 1.6s ease-out .5s forwards; }
        .orb-3 { width:220px;height:220px; background: radial-gradient(circle, rgba(253,230,138,.2) 0%, transparent 70%); top:55%; left:58%; opacity:0; animation: orbDrift 6s ease-in-out 1.2s infinite reverse, orbIn 1.8s ease-out .7s forwards; }
        @keyframes orbIn { to { opacity: 1; } }
        @keyframes orbPulse { 0%,100% { transform: translate(-50%,-55%) scale(1); opacity:.55; } 50% { transform: translate(-50%,-55%) scale(1.18); opacity:.85; } }
        @keyframes orbDrift { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-25px) scale(1.1); } 66% { transform: translate(-20px,15px) scale(.95); } }
        #particle-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .logo-wrap { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 32px; }
        .rings { position: absolute; top:50%; left:50%; width:140px; height:140px; transform: translate(-50%,-50%); pointer-events: none; }
        .ring-el { position: absolute; inset:0; border-radius:38px; border:1.5px solid transparent; opacity:0; }
        .ring-el:nth-child(1) { border-color: rgba(251,191,36,.45); animation: ringExpand 2.8s cubic-bezier(.22,1,.36,1) .7s infinite; }
        .ring-el:nth-child(2) { border-color: rgba(251,191,36,.25); animation: ringExpand 2.8s cubic-bezier(.22,1,.36,1) 1.15s infinite; }
        .ring-el:nth-child(3) { border-color: rgba(251,191,36,.12); animation: ringExpand 2.8s cubic-bezier(.22,1,.36,1) 1.6s infinite; }
        @keyframes ringExpand { 0% { transform: scale(.72); opacity:.7; border-radius:32px; } 100% { transform: scale(1.55); opacity:0; border-radius:48px; } }
        .orbit { position: absolute; top:50%; left:50%; width:130px; height:130px; transform: translate(-50%,-50%); border-radius:50%; border:1.5px dashed rgba(251,191,36,.2); opacity:0; animation: orbitIn 1s ease .9s forwards, orbitSpin 12s linear 1s infinite; pointer-events: none; }
        .orbit-dot { position: absolute; top:-4px; left:50%; width:8px; height:8px; margin-left:-4px; border-radius:50%; background: var(--gold); box-shadow: 0 0 12px var(--gold-glow), 0 0 4px var(--gold); }
        @keyframes orbitIn { to { opacity: 1; } }
        @keyframes orbitSpin { to { transform: translate(-50%,-50%) rotate(360deg); } }
        .logo-mark {
            position: relative; width:96px; height:96px; border-radius:28px;
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 55%, #020617 100%);
            border: 1.5px solid rgba(251,191,36,.4);
            display: grid; place-items: center;
            box-shadow: 0 0 0 1px rgba(251,191,36,.06), 0 24px 56px rgba(0,0,0,.55), 0 0 48px rgba(251,191,36,.15), inset 0 1px 0 rgba(255,255,255,.06);
            opacity:0; transform: scale(.55) rotate(-8deg);
            animation: logoReveal 1.05s cubic-bezier(.34,1.4,.64,1) .2s forwards;
            overflow: hidden;
        }
        .logo-mark::after {
            content:''; position:absolute; inset:0;
            background: linear-gradient(105deg, transparent 35%, rgba(253,230,138,.18) 48%, rgba(255,255,255,.08) 52%, transparent 65%);
            transform: translateX(-120%);
            animation: shimmer 2.8s ease-in-out 1.4s infinite;
        }
        @keyframes shimmer { 0%,100% { transform: translateX(-120%); } 40%,60% { transform: translateX(120%); } }
        @keyframes logoReveal { 0% { opacity:0; transform: scale(.55) rotate(-8deg); } 60% { opacity:1; transform: scale(1.06) rotate(2deg); } 100% { opacity:1; transform: scale(1) rotate(0deg); } }
        .logo-mark span {
            position: relative; z-index: 2; font-size: 44px; font-weight: 900; letter-spacing: -2px;
            background: linear-gradient(135deg, #fde68a 0%, #fbbf24 45%, #d97706 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            filter: drop-shadow(0 2px 8px rgba(251,191,36,.35));
            animation: letterGlow 2.5s ease-in-out 1.2s infinite;
        }
        @keyframes letterGlow { 0%,100% { filter: drop-shadow(0 2px 8px rgba(251,191,36,.3)); } 50% { filter: drop-shadow(0 2px 16px rgba(251,191,36,.65)); } }
        .brand { text-align: center; }
        .brand h1 {
            font-size: clamp(30px, 7.5vw, 40px); font-weight: 900; letter-spacing: -.5px; line-height: 1.1;
            display: flex; justify-content: center; gap: 1px; direction: ltr; unicode-bidi: isolate;
        }
        .brand h1 .char { display: inline-block; opacity: 0; transform: translateY(22px) scale(.85); animation: charIn .55s cubic-bezier(.22,1,.36,1) forwards; }
        .brand h1 .char.gold { color: var(--gold); }
        @keyframes charIn { to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .brand .line { display: block; width: 0; height: 2px; margin: 14px auto 0; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: drawLine .9s cubic-bezier(.22,1,.36,1) 1.25s forwards; }
        @keyframes drawLine { to { width: min(55%, 9.5em); } }
        .progress-wrap { position: absolute; bottom: max(64px, env(safe-area-inset-bottom) + 48px); left: 50%; transform: translateX(-50%); width: 88vw; z-index: 5; opacity: 0; animation: fadeUp .6s ease .85s forwards; }
        .progress-track { height: 3.5px; background: rgba(255,255,255,.07); border-radius: 999px; overflow: hidden; position: relative; }
        .progress-bar { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-bright)); box-shadow: 0 0 16px var(--gold-glow), 0 0 4px var(--gold); position: relative; transition: width .12s linear; }
        .progress-bar::after { content:''; position:absolute; right:0; top:50%; transform: translateY(-50%); width:10px; height:10px; border-radius:50%; background: var(--gold-bright); box-shadow: 0 0 14px 4px var(--gold-glow); opacity:.9; }
        .progress-label { margin-top: 16px; text-align: center; font-size: 11px; font-weight: 600; color: var(--splash-slate); letter-spacing: .05em; min-height: 18px; transition: opacity .25s ease, transform .25s ease; }
        .progress-label.swap { opacity: 0; transform: translateY(6px); }
        .scan { position: absolute; left:0; right:0; height:80px; background: linear-gradient(to bottom, transparent, rgba(251,191,36,.04), transparent); opacity:0; pointer-events:none; animation: scanMove 3.5s ease-in-out 1s infinite; }
        @keyframes scanMove { 0% { top:-10%; opacity:0; } 15% { opacity:1; } 85% { opacity:1; } 100% { top:110%; opacity:0; } }
    </style>
</head>
<body class="p-6">

    <div id="splash">
        <div class="grid-bg"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="scan"></div>
        <canvas id="particle-canvas"></canvas>

        <div class="logo-wrap">
            <div class="rings">
                <div class="ring-el"></div>
                <div class="ring-el"></div>
                <div class="ring-el"></div>
            </div>
            <div class="orbit"><div class="orbit-dot"></div></div>

            <div class="logo-mark"><span>E</span></div>

            <div class="brand">
                <h1 id="brand-title"></h1>
                <div class="line"></div>
            </div>
        </div>

        <div class="progress-wrap">
            <div class="progress-track"><div class="progress-bar" id="splash-progress"></div></div>
            <div class="progress-label" id="splash-status">در حال آماده‌سازی...</div>
        </div>
    </div>

    <script>
    (function () {
        const splash   = document.getElementById('splash');
        const progress = document.getElementById('splash-progress');
        const status   = document.getElementById('splash-status');
        const canvas   = document.getElementById('particle-canvas');
        const ctx      = canvas.getContext('2d');

        const title = document.getElementById('brand-title');
        const text  = 'E.BANK';
        [...text].forEach((ch, i) => {
            const span = document.createElement('span');
            span.className = 'char' + (ch === 'E' ? ' gold' : '');
            span.textContent = ch;
            span.style.animationDelay = (0.55 + i * 0.07) + 's';
            title.appendChild(span);
        });

        let W, H, particles = [];
        const PARTICLE_COUNT = 48;

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor(spawn) { this.reset(spawn); }
            reset(spawn) {
                this.x = Math.random() * W;
                this.y = spawn ? H + Math.random() * 60 : Math.random() * H;
                this.size = 0.8 + Math.random() * 2.2;
                this.speedY = 0.25 + Math.random() * 0.9;
                this.speedX = (Math.random() - 0.5) * 0.35;
                this.alpha = 0.15 + Math.random() * 0.55;
                this.life  = 0;
                this.maxLife = 180 + Math.random() * 220;
                this.hue = 38 + Math.random() * 18;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX + Math.sin(this.life * 0.03) * 0.15;
                this.life++;
                if (this.life > this.maxLife || this.y < -20) this.reset(true);
            }
            draw() {
                const fade = this.life < 30 ? this.life / 30 : this.life > this.maxLife - 40 ? (this.maxLife - this.life) / 40 : 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 95%, 60%, ${this.alpha * fade})`;
                ctx.fill();
                if (this.size > 1.8) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 90%, 55%, ${this.alpha * fade * 0.12})`;
                    ctx.fill();
                }
            }
        }
        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle(false));

        let animId;
        function loop() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => { p.update(); p.draw(); });
            animId = requestAnimationFrame(loop);
        }
        loop();

        const messages = ['در حال آماده‌سازی...', 'برقراری ارتباط امن...', 'بارگذاری هسته سیستم...', 'فعال‌سازی ماژول‌ها...', 'تقریباً آماده...'];
        let pct = 0, msgIndex = 0, finished = false;
        const duration = 5000;
        const interval = 32;
        const step = 100 / (duration / interval);

        function setStatus(t) {
            status.classList.add('swap');
            setTimeout(() => { status.textContent = t; status.classList.remove('swap'); }, 220);
        }

        const timer = setInterval(() => {
            if (finished) return;
            pct = Math.min(100, pct + step + (Math.random() * 1.1 - 0.35));
            progress.style.width = pct + '%';
            const newIndex = Math.min(messages.length - 1, Math.floor(pct / 22));
            if (newIndex !== msgIndex) { msgIndex = newIndex; setStatus(messages[msgIndex]); }
            if (pct >= 100) {
                finished = true;
                clearInterval(timer);
                setStatus('خوش آمدید');
                setTimeout(finish, 420);
            }
        }, interval);

        function finish() {
            splash.classList.add('fade-out');
            setTimeout(() => {
                cancelAnimationFrame(animId);
                splash.remove();
                document.body.classList.remove('loading');
            }, 900);
        }

        splash.addEventListener('click', () => {
            if (!finished) {
                finished = true;
                clearInterval(timer);
                progress.style.width = '100%';
                setStatus('خوش آمدید');
                setTimeout(finish, 280);
            }
        });
    })();
    </script>

    <div class="login-card w-full max-w-sm p-8 rounded-[3.5rem] relative z-10">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-emerald-500 rounded-2xl shadow-xl shadow-emerald-100 flex items-center justify-center text-white mx-auto mb-4">
                <i class="fas fa-university text-2xl"></i>
            </div>
            <h2 class="text-2xl font-[900] text-slate-800 tracking-tighter">E<span class="text-emerald-600">.</span>BANK</h2>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest mt-1">Secure Access Portal</p>
        </div>

        <div class="space-y-4">
            <div class="relative">
                <input type="text" id="login-pool-code" placeholder="کد اختصاصی بانک" class="ltr-input w-full p-4 pr-12 bg-slate-50 border border-transparent rounded-2xl text-sm font-black outline-none focus:border-emerald-500 uppercase">
                <i class="fas fa-fingerprint absolute right-4 top-4 text-slate-300 text-lg"></i>
            </div>
            <div class="relative">
                <input type="tel" id="login-mobile" placeholder="شماره موبایل" class="ltr-input w-full p-4 pr-12 bg-slate-50 border border-transparent rounded-2xl text-sm font-black outline-none focus:border-emerald-500">
                <i class="fas fa-phone-alt absolute right-4 top-4 text-slate-300 text-lg"></i>
            </div>
            <div class="relative">
                <input type="password" id="login-password" placeholder="رمز عبور" class="w-full p-4 pr-12 bg-slate-50 border border-transparent rounded-2xl text-sm font-black outline-none focus:border-emerald-500">
                <i class="fas fa-lock absolute right-4 top-4 text-slate-300 text-lg"></i>
            </div>
            <button onclick="handleLogin()" id="login-btn" class="btn-tap w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-sm shadow-xl flex items-center justify-center gap-2 mt-2">تایید هویت و ورود</button>
            <div class="pt-6 text-center border-t border-slate-100 space-y-4">
                <button onclick="openForgotPassword()" class="text-[10px] font-bold text-slate-400 block w-full">فراموشی رمز عبور؟</button>
                <button onclick="location.href='create_pool.html'" class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-6 py-2 rounded-full border border-emerald-100">تأسیس بانک جدید <i class="fas fa-plus-circle mr-1"></i></button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

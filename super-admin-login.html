<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>E.BANK | SUPER ADMIN</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Vazirmatn,sans-serif;background:#020617;color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:min(440px,100%);background:rgba(15,23,42,.86);border:1px solid rgba(251,191,36,.22);border-radius:34px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.55);backdrop-filter:blur(20px)}
    .input{width:100%;background:#020617;border:1px solid #334155;color:#fff;border-radius:18px;padding:14px 16px;outline:none;transition:.2s}.input:focus{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.1)}
    .btn{width:100%;border:0;border-radius:18px;padding:14px;font-weight:900;cursor:pointer;background:#fbbf24;color:#020617}.btn:disabled{opacity:.6;cursor:wait}
    .badge{display:inline-flex;padding:6px 12px;border-radius:999px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.18);color:#fbbf24;font-size:10px;font-weight:900}
  </style>
</head>
<body>
  <section class="card">
    <div class="text-center mb-7">
      <div class="badge mb-4">PRIVATE MANAGEMENT CONSOLE</div>
      <h1 class="text-3xl font-black">SUPER <span class="text-yellow-400">ADMIN</span></h1>
      <p class="text-[11px] text-slate-500 mt-2">E.BANK COMMAND CENTER</p>
    </div>

    <form id="login-form" class="space-y-4" autocomplete="off">
      <div>
        <label class="block text-[10px] font-bold text-slate-400 mb-2">ایمیل حساب مدیریت ارشد</label>
        <input id="email" class="input" type="email" inputmode="email" autocomplete="username" required placeholder="ایمیل حساب Supabase">
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-400 mb-2">رمز حساب</label>
        <input id="auth-password" class="input" type="password" autocomplete="current-password" required placeholder="رمز حساب Supabase">
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-400 mb-2">کلید اصلی COMMAND CENTER</label>
        <input id="master-password" class="input" type="password" autocomplete="off" required placeholder="رمز اصلی">
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-400 mb-2">کد امنیتی مرحله دوم</label>
        <input id="otp" class="input text-center tracking-[.35em]" type="text" inputmode="numeric" autocomplete="one-time-code" required placeholder="کد امنیتی">
      </div>
      <button id="login-btn" class="btn mt-2" type="submit">ورود امن به Command Center</button>
    </form>

    <p class="text-center text-[9px] text-slate-600 mt-6">این صفحه مستقل از Login اعضا و مدیران E.BANK است.</p>
  </section>

<script>
const SUPABASE_URL = 'https://kqnsbnpznkwkwukzokik.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxbnNibnB6bmt3a3d1a3pva2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1NDc4NjgsImV4cCI6MjA4MjEyMzg2OH0.dsqyFP37JyrfYDVwasNZW_Aid9ah0e6SxdnS8j8xV5s';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{persistSession:true,storageKey:'ebank-super-admin-session',storage:window.localStorage,autoRefreshToken:true,detectSessionInUrl:false}
});

(async()=>{ await client.auth.signOut(); })();

document.getElementById('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('login-btn');
  const email=document.getElementById('email').value.trim();
  const authPassword=document.getElementById('auth-password').value;
  const masterPassword=document.getElementById('master-password').value;
  const otp=document.getElementById('otp').value.trim();
  btn.disabled=true; btn.textContent='در حال احراز هویت...';

  try{
    const {data,error}=await client.auth.signInWithPassword({email,password:authPassword});
    if(error || !data.user) throw new Error('ایمیل یا رمز حساب صحیح نیست.');

    const {data:profile,error:profileError}=await client.from('members').select('id,full_name,is_super_admin,status').eq('id',data.user.id).single();
    if(profileError || !profile || profile.is_super_admin!==true || profile.status==='blocked'){
      await client.auth.signOut();
      throw new Error('این حساب مجوز Super Admin ندارد.');
    }

    const {data:masterOk,error:masterError}=await client.rpc('verify_master_access',{input_password:masterPassword});
    if(masterError || masterOk!==true){ await client.auth.signOut(); throw new Error('کلید اصلی اشتباه است.'); }

    const {data:otpOk,error:otpError}=await client.rpc('verify_2fa_access',{user_provided_code:otp});
    if(otpError || otpOk!==true){ await client.auth.signOut(); throw new Error('کد امنیتی مرحله دوم صحیح نیست.'); }

    sessionStorage.setItem('super_admin_2fa','true');
    sessionStorage.setItem('user_name',profile.full_name || 'E.BANK OWNER');
    window.location.replace('super_admin.html');
  }catch(err){
    await Swal.fire({title:'ورود ناموفق',text:err.message || 'خطای ناشناخته',icon:'error',confirmButtonColor:'#fbbf24'});
  }finally{
    btn.disabled=false; btn.textContent='ورود امن به Command Center';
  }
});
</script>
</body>
</html>

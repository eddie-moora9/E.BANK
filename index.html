    <script>
    (function () {
        const splash   = document.getElementById('splash');
        const progress = document.getElementById('splash-progress');
        const status   = document.getElementById('splash-status');
        const canvas   = document.getElementById('particle-canvas');
        const ctx      = canvas.getContext('2d');

        const title = document.getElementById('brand-title');
        const text  = 'E.BANK';
        [...text].forEach((ch, i) => {
            const span = document.createElement('span');
            span.className = 'char' + (ch === 'E' ? ' gold' : '');
            span.textContent = ch;
            span.style.animationDelay = (0.55 + i * 0.07) + 's';
            title.appendChild(span);
        });

        let W, H, particles = [];
        const PARTICLE_COUNT = 48;

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor(spawn) { this.reset(spawn); }
            reset(spawn) {
                this.x = Math.random() * W;
                this.y = spawn ? H + Math.random() * 60 : Math.random() * H;
                this.size = 0.8 + Math.random() * 2.2;
                this.speedY = 0.25 + Math.random() * 0.9;
                this.speedX = (Math.random() - 0.5) * 0.35;
                this.alpha = 0.15 + Math.random() * 0.55;
                this.life  = 0;
                this.maxLife = 180 + Math.random() * 220;
                this.hue = 38 + Math.random() * 18;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX + Math.sin(this.life * 0.03) * 0.15;
                this.life++;
                if (this.life > this.maxLife || this.y < -20) this.reset(true);
            }
            draw() {
                const fade = this.life < 30 ? this.life / 30 : this.life > this.maxLife - 40 ? (this.maxLife - this.life) / 40 : 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 95%, 60%, ${this.alpha * fade})`;
                ctx.fill();
                if (this.size > 1.8) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 90%, 55%, ${this.alpha * fade * 0.12})`;
                    ctx.fill();
                }
            }
        }
        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle(false));

        let animId;
        function loop() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => { p.update(); p.draw(); });
            animId = requestAnimationFrame(loop);
        }
        loop();

        const messages = ['در حال آماده‌سازی...', 'برقراری ارتباط امن...', 'بارگذاری هسته سیستم...', 'فعال‌سازی ماژول‌ها...', 'تقریباً آماده...'];
        let pct = 0, msgIndex = 0, finished = false;
        const duration = 5000;
        const interval = 32;
        const step = 100 / (duration / interval);

        function setStatus(t) {
            status.classList.add('swap');
            setTimeout(() => { status.textContent = t; status.classList.remove('swap'); }, 220);
        }

        const timer = setInterval(() => {
            if (finished) return;
            pct = Math.min(100, pct + step + (Math.random() * 1.1 - 0.35));
            progress.style.width = pct + '%';
            const newIndex = Math.min(messages.length - 1, Math.floor(pct / 22));
            if (newIndex !== msgIndex) { msgIndex = newIndex; setStatus(messages[msgIndex]); }
            if (pct >= 100) {
                finished = true;
                clearInterval(timer);
                setStatus('خوش آمدید');
                setTimeout(finish, 420);
            }
        }, interval);

        function finish() {
            splash.classList.add('fade-out');
            setTimeout(() => {
                cancelAnimationFrame(animId);
                splash.remove();
                document.body.classList.remove('loading');
            }, 900);
        }

        splash.addEventListener('click', () => {
            if (!finished) {
                finished = true;
                clearInterval(timer);
                progress.style.width = '100%';
                setStatus('خوش آمدید');
                setTimeout(finish, 280);
            }
        });
    })();
    </script>

// بخش دوم: ورود اعضا
async function handleLogin() {
    // ۱. دسترسی به المان‌ها
    const pI = document.getElementById('login-pool-code');
    const mI = document.getElementById('login-mobile');
    const psI = document.getElementById('login-password');
    const btn = document.getElementById('login-btn');

    if(!pI || !mI || !psI) return;

    const p = pI.value.trim().toUpperCase();
    const m = mI.value.trim().replace(/\s+/g, ''); // حذف فاصله‌های احتمالی

        // ۶. دریافت پروفایل کامل عضو از جدول دیتابیس
        const { data: prof, error: dbError } = await supabaseClient
            .from('members')
            .select('*')
            .eq('id', u.user.id)
            .single();

        if (dbError || !prof) throw new Error("پروفایل کاربری یافت نشد! ❌");

            }
        }

        // ۷. ثبت دقیق اطلاعات در حافظه موقت (Session Storage) 👇
        sessionStorage.clear(); // پاکسازی نشست‌های قبلی
        sessionStorage.setItem('user_id', prof.id);
        sessionStorage.setItem('pool_id', prof.pool_id);
        sessionStorage.setItem('user_name', prof.full_name); // برای نمایش نام در هدر ✅
        sessionStorage.setItem('is_admin', String(prof.is_admin));

        // ورود تازه یعنی همین الان فعالیت کردی؛ ساعت نگهبان بی‌کاری رو ریست کن
        // تا بلافاصله بعد از ورود، به‌خاطر آخرین فعالیتِ روزهای قبل خارج نشی
        localStorage.setItem('last_action_timestamp', Date.now());

        // ذخیره کد بانک برای ورودهای بعدی
        localStorage.setItem('saved_pool_code', p);

        // ۸. نمایش پیام موفقیت شیک
       await Swal.fire({
            title: 'ورود موفقیت‌آمیز ✅',
            text: `خوش آمدید ${prof.full_name}`,
            icon: 'success',
            showConfirmButton: false,
            timer: 3000,
            customClass: { popup: 'rounded-[2.5rem]' }
        });

        // ۹. انتقال هوشمند با وقفه ایمنی (رفع مشکل پرش به لاگین) 👇
        setTimeout(() => {
            if (prof.is_admin === true) {
                window.location.replace('admin.html');
            } else {
                window.location.replace('member.html');
            }
        }, 150); // این ۱۵۰ میلی‌ثانیه حیاتی است!

    } catch (e) {
        // مدیریت خطاها
        console.error("Login Error:", e.message);
        Swal.fire({ 
            title: 'توقف ورود', 
            text: e.message, 
            icon: 'error', 
            confirmButtonColor: '#ef4444',
            customClass: { popup: 'rounded-[2.5rem]' }
        });
        btn.disabled = false; 
        btn.innerText = 'تایید هویت و ورود';
    }
}

/* ==================================================
   فراموشی رمز عبور — فقط مدیر بانک؛ درخواست برای سوپر ادمین ثبت می‌شود
   ================================================== */
function faToEn(str) {
    return String(str || '')
        .replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })
        .replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); });
}

async function openForgotPassword() {
    const poolEl = document.getElementById('login-pool-code');
    const mobEl = document.getElementById('login-mobile');
    const prefPool = ((poolEl && poolEl.value) || localStorage.getItem('saved_pool_code') || '').trim().toUpperCase();
    const prefMobile = ((mobEl && mobEl.value) || '').trim();
    const inputStyle = 'width:85%; max-width:100%; box-sizing:border-box; margin:8px auto; direction:ltr; text-align:left;';

    const { value: vals } = await Swal.fire({
        title: 'فراموشی رمز عبور',
        html: `
            <p style="font-size:11px; line-height:2; color:#64748b; margin:0 0 6px;">
                این گزینه <b>فقط برای مدیر بانک</b> است. درخواست شما برای سوپر ادمین ارسال می‌شود.
                اعضا برای بازیابی رمز با مدیر بانک خود تماس بگیرند.
            </p>
            <input id="fp-pool" class="swal2-input" placeholder="کد اختصاصی بانک" value="${prefPool.replace(/"/g, '&quot;')}" style="${inputStyle} text-transform:uppercase;">
            <input id="fp-mobile" class="swal2-input" type="tel" placeholder="شماره موبایل مدیر" value="${prefMobile.replace(/"/g, '&quot;')}" style="${inputStyle}">
        `,
        confirmButtonText: 'ارسال درخواست',
        cancelButtonText: 'انصراف',
        showCancelButton: true,
        confirmButtonColor: '#10b981',
        focusConfirm: false,
        customClass: { popup: 'rounded-[2.5rem]' },
        preConfirm: () => {
            const pool = faToEn(document.getElementById('fp-pool').value).trim().toUpperCase();
            const mobile = faToEn(document.getElementById('fp-mobile').value).replace(/\s+/g, '');
            if (!pool || !mobile) {
                Swal.showValidationMessage('کد بانک و شماره موبایل را وارد کنید');
                return false;
            }
            return [pool, mobile];
        }
    });
    if (!vals) return;

    Swal.fire({ title: 'در حال ارسال...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

    try {
        const { error } = await supabaseClient.rpc('request_manager_password_reset', {
            pool_code_param: vals[0],
            mobile_param: vals[1]
        });
        if (error) throw error;

        Swal.fire({
            title: 'درخواست ثبت شد ✅',
            text: 'اگر این شماره به‌عنوان مدیر این بانک ثبت شده باشد، درخواست شما برای سوپر ادمین ارسال شد. پس از بررسی، رمز جدید را سوپر ادمین به شما اطلاع می‌دهد.',
            icon: 'success',
            confirmButtonColor: '#10b981',
            customClass: { popup: 'rounded-[2.5rem]' }
        });
    } catch (e) {
        Swal.fire({ title: 'خطا در ارسال', text: e.message, icon: 'error', confirmButtonColor: '#ef4444' });
    }
}

/* ==================================================
   تغییر اجباری رمز بعد از بازنشانی توسط سوپر ادمین
   ================================================== */
async function forceChangePassword() {
    const inputStyle = 'width:85%; max-width:100%; box-sizing:border-box; margin:8px auto;';
    const res = await Swal.fire({
        title: 'رمز جدید خود را وارد کنید',
        html: `
            <p style="font-size:11px; line-height:2; color:#64748b; margin:0 0 6px;">
                رمز شما توسط سوپر ادمین بازنشانی شده است. برای ادامه، یک رمز جدید انتخاب کنید.
            </p>
            <input id="np-1" type="password" class="swal2-input" placeholder="رمز جدید" autocomplete="new-password" style="${inputStyle}">
            <input id="np-2" type="password" class="swal2-input" placeholder="تکرار رمز جدید" autocomplete="new-password" style="${inputStyle}">
        `,
        confirmButtonText: 'ثبت رمز جدید',
        cancelButtonText: 'خروج',
        showCancelButton: true,
        allowOutsideClick: false,
        allowEscapeKey: false,
        focusConfirm: false,
        confirmButtonColor: '#10b981',
        customClass: { popup: 'rounded-[2.5rem]' },
        preConfirm: async () => {
            const a = document.getElementById('np-1').value;
            const b = document.getElementById('np-2').value;
            if (!a || !b) { Swal.showValidationMessage('هر دو کادر را پر کنید'); return false; }
            if (a.length < 6) { Swal.showValidationMessage('رمز جدید حداقل ۶ کاراکتر باشد'); return false; }
            if (a !== b) { Swal.showValidationMessage('تکرار رمز با رمز جدید یکسان نیست'); return false; }

            const { error } = await supabaseClient.auth.updateUser({ password: a });
            if (error) {
                const m = String(error.message || '');
                if (/different from the old/i.test(m)) {
                    Swal.showValidationMessage('رمز جدید نباید با رمز فعلی (موقت) یکسان باشد');
                } else {
                    Swal.showValidationMessage('تغییر رمز انجام نشد: ' + m);
                }
                return false;
            }
            return true;
        }
    });
    return res.isConfirmed === true;
}
